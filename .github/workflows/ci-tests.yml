name: CI - Lint & Tests

on:
  push:
    branches: [main, develop]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install "black>=24.4" "flake8>=7.0"
      - name: black
        run: black --check src backend tests
      - name: flake8
        run: flake8 src backend tests

  test-backend:
    runs-on: ubuntu-latest
    needs: lint-python
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - name: pytest (API, inférence ONNX, erreurs HTTP)
        run: pytest -v --junitxml=pytest-backend.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pytest-backend
          path: backend/pytest-backend.xml

  test-ml:
    runs-on: ubuntu-latest
    needs: lint-python
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Dépendances (PyTorch CPU)
        run: |
          pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          pip install timm pandas scikit-learn pyyaml pillow matplotlib pytest
      - name: pytest (split sans fuite, pertes, Grad-CAM exportable)
        run: pytest tests -v

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: ESLint
        run: npm run lint
      - name: Build Vite
        run: npm run build
